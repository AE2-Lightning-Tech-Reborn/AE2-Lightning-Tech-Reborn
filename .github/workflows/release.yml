name: Release

on:
  release:
    types: [published]

concurrency:
  group: ae2lt-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      platform_version: ${{ steps.metadata.outputs.platform_version }}
      release_type: ${{ steps.metadata.outputs.release_type }}
      game_version: ${{ steps.metadata.outputs.game_version }}
      mod_loader: ${{ steps.metadata.outputs.mod_loader }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release metadata
        id: metadata
        run: python3 .github/scripts/release.py metadata

      - name: Set up Java ${{ steps.metadata.outputs.java_version }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.metadata.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      - name: Download released build dependencies
        id: dependencies
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DEPENDENCIES_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/release.py dependencies

      # Existing release packaging excludes timing-sensitive checks; validate the JAR below.
      - name: Build release
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ./gradlew --no-daemon clean build -x check --max-workers 1 -Pmod_version="$VERSION" \
            --init-script .github/release-dependencies.init.gradle

      - name: Prepare distributable JAR
        run: python3 .github/scripts/release.py artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 3

  upload-github-release:
    name: Upload GitHub Release asset
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Upload JAR to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_dir="$(mktemp -d)"
          trap 'rm -rf "$existing_dir"' EXIT
          for asset in release-artifacts/*.jar release-artifacts/SHA256SUMS; do
            name="$(basename "$asset")"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$name" --dir "$existing_dir" >/dev/null 2>&1; then
              if ! cmp -s "$asset" "$existing_dir/$name"; then
                echo "Refusing to replace existing release asset with different content: $name" >&2
                exit 1
              fi
              echo "Release asset already exists with identical content: $name"
            else
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

  publish-platforms:
    name: Publish to CurseForge and Modrinth
    needs: [build, upload-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify platform publishing tokens
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || secrets.MODRINTH }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN || secrets.CURSEFORGE }}
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN" || { echo "Missing MODRINTH_TOKEN repository secret." >&2; exit 1; }
          test -n "$CURSEFORGE_TOKEN" || { echo "Missing CURSEFORGE_TOKEN repository secret." >&2; exit 1; }

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Publish mod files
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ArHeh5Fz
          modrinth-token: ${{ secrets.MODRINTH_TOKEN || secrets.MODRINTH }}
          curseforge-id: 1527395
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN || secrets.CURSEFORGE }}
          files: release-artifacts/*.jar
          name: AE2 Lightning Tech ${{ needs.build.outputs.version }} (${{ needs.build.outputs.mod_loader }} ${{ needs.build.outputs.game_version }})
          version: ${{ needs.build.outputs.platform_version }}
          version-type: ${{ needs.build.outputs.release_type }}
          loaders: ${{ needs.build.outputs.mod_loader }}
          game-versions: ${{ needs.build.outputs.game_version }}
          dependencies: |
            thunderbolt-core(required){modrinth:M5jhzZXH}{curseforge:1631756}
          changelog: ${{ github.event.release.body }}
