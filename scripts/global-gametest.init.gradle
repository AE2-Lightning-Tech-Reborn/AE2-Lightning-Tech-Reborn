allprojects {
    plugins.withId('net.minecraftforge.gradle') {
        if ((findProperty('ae2ltGameTestProfile') ?: 'full') == 'full') {
            dependencies.add('runtimeOnly', fg.deobf('maven.modrinth:farmers-delight:1.20.1-1.3.4'))
            if (!project.hasProperty('mguTestMods')) {
                throw new GradleException('Full GameTests require -PmguTestMods with the Forge 1.20.1 MGU jar')
            }
            repositories.flatDir { dirs project.property('mguTestMods') }
            dependencies.add('runtimeOnly', fg.deobf('local.mgu:mob_grinding_utils-1.20.1:1.1.0'))
        }
    }
    afterEvaluate {
        def profile = findProperty('ae2ltGameTestProfile') ?: 'full'
        def actualCompatibility = (findProperty('ae2ltActualCompatibility') ?: 'false').toBoolean()
        if (!(profile in ['full', 'minimal'])) throw new GradleException('Unknown GameTest profile: ' + profile)
        if (actualCompatibility && profile != 'full') {
            throw new GradleException('Actual compatibility requires the complete full profile')
        }
        sourceSets.jdb.java.setIncludes(['**/*GameTests.java', '**/ForgeCraftingInput.java'])
        sourceSets.jdb.java.setExcludes(actualCompatibility ? [] : ['**/ActualCompatibilityGameTests.java'])
        tasks.named('processJdbResources', ProcessResources) {
            from('src/jdb/resources/data/ae2lt/structures/pigmee_station_empty.nbt') {
                into 'data/ae2lt_phase_command/structures'
            }
            if (actualCompatibility) {
                from('src/jdb/resources/data/ae2lt_migration/structures/migration_test.nbt') {
                    into 'data/ae2lt_actual/structures'
                }
                from('src/jdb/resources/data/ae2lt_machine_recharge/structures/empty.nbt') {
                    into 'data/ae2lt_actual/structures'
                }
            }
        }
        def excluded = actualCompatibility ? [] : ['ActualCompatibilityGameTests']
        if (profile == 'full' && !(findProperty('ae2ltInscriberFixture') ?: 'false').toBoolean()) {
            sourceSets.jdb.resources.srcDir 'src/overloadTest/resources'
        }
        if (profile == 'minimal') {
            excluded += ['EnergyApiStressGameTests', 'UpstreamFixGameTests', 'MiningFactoryStressGameTests',
                    'MguConveyorPhaseLockGameTests', 'PhaseLockConveyorGameTests', 'JeiWirelessSupplyGameTests', 'TianshuWirelessBindingGameTests',
                    'TianshuQuantumBridgeGameTests', 'TianshuPatternUploadGameTests', 'InterfaceEnergyRoutingGameTests',
                    'PatternMigrationGameTests', 'OverloadedInterfaceWiredTargetGameTests',
                    'ProviderEnergyOutputGameTests', 'OverloadFactoryReactionGameTests', 'MachineNetworkRechargeGameTests',
                    'PigmeeCuttingBoardGameTests']
            excluded.each { sourceSets.jdb.java.exclude '**/' + it + '.java' }
            configurations.runtimeOnly.dependencies.removeIf { !(it.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics']) }
        }
        def namespaces = new TreeSet(['ae2lt', 'minecraft'])
        (sourceSets.main.allJava.files + sourceSets.jdb.allJava.files).each { f ->
            (f.getText('UTF-8') =~ /@(?:net\.minecraftforge\.gametest\.)?GameTestHolder\(\s*"([^"]+)"\s*\)/).each { namespaces.add(it[1]) }
            (f.getText('UTF-8') =~ /templateNamespace\s*=\s*"([^"]+)"/).each { namespaces.add(it[1]) }
        }
        minecraft.runs.gameTestServer {
            workingDirectory project.file(findProperty('ae2ltGameTestRunDirectory') ?: 'run-gametest/global-' + profile)
            property 'forge.enabledGameTestNamespaces', namespaces.join(',')
            property 'forge.logging.console.level', 'info'
            property 'ae2lt.addonApiTests', 'true'
            property 'ae2lt.neoecoTestPresent', actualCompatibility.toString()
            if (actualCompatibility) {
                // LDLib's optional EMI render target is unsuitable for global server audit.
                // Keep runtime injections active and test normal dedicated-server loading.
                property 'thunderbolt.mixinAudit', 'false'
            }
            property 'ae2lt.pigmeeSenseWithCurios',
                    (profile == 'full' && (findProperty('enable_curios_runtime') ?: 'true').toBoolean()).toString()
            mods { ae2lt { source sourceSets.jdb } }
            jvmArgs '-Xms512m', '-Xmx2g'
        }
        println 'GAMETEST_PROFILE=' + profile
        println 'GAMETEST_DEPENDENT_FIXTURES_NOT_RUN=' + excluded.join(',')
    }
}
