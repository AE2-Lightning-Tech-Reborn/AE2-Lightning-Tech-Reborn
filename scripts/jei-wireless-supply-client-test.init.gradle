// Run jei-wireless-supply-test.init.gradle with runGameTestServer first to create the disposable world.
// ./gradlew -I scripts/jei-wireless-supply-client-test.init.gradle runClient -Pjei_version=<version>
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/JeiWirelessSupplyExtendedCraftingProbe.java'])
        tasks.named('compileJdbJava').configure {
            source = project.files('src/jdb/java/com/moakiee/ae2lt/debug/JeiWirelessSupplyExtendedCraftingProbe.java')
        }
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group in ['com.moakiee.thunderbolt', 'appeng', 'org.appliedenergistics', 'mezz.jei',
                    'dev.architectury', 'me.shedaniel.cloth', 'top.theillusivec4.curios']
                    || (dep.group == 'maven.modrinth' && dep.name == 'applied-energistics-2-wireless-terminals'))
        }
        // Optional local jars let the probe use the exact modpack versions.
        def extendedCrafting = project.findProperty('extended_crafting_test_jar')
        def cucumber = project.findProperty('cucumber_test_jar')
        [extendedCrafting, cucumber].findAll { it }.each { jar ->
            repositories.flatDir { dirs project.file(jar).parentFile }
        }
        def localJar = { jar -> 'ae2lt.local-test:' + project.file(jar).name.replaceFirst(/\.jar$/, '') + ':local' }
        [extendedCrafting ? localJar(extendedCrafting) : 'maven.modrinth:extended-crafting:NtEZsGjO',
         cucumber ? localJar(cucumber) : 'maven.modrinth:cucumber:xnLznSfT'].each { coordinate ->
            dependencies.add('jdbCompileOnly', fg.deobf(coordinate))
            dependencies.add('runtimeOnly', fg.deobf(coordinate))
        }
        def table = project.findProperty('jei_supply_test_table') ?: 'advanced'
        def probeDirectory = project.file('build/jei-extended-crafting-client-' + project.jei_version + '-' + table)
        def sourceWorld = project.file('build/jei-wireless-supply-forge/world')
        def clientWorld = new File(probeDirectory, 'saves/JeiWirelessSupplyQA')
        minecraft.runs.client {
            workingDirectory probeDirectory
            property 'ae2lt.extendedCraftingSupplyProbe', 'true'
            property 'ae2lt.extendedCraftingSupplyProbe.table', table
            property 'forge.logging.console.level', 'info'
            args '--quickPlaySingleplayer', 'JeiWirelessSupplyQA'
            mods { ae2lt { source sourceSets.jdb } }
        }
        tasks.matching { it.name == 'runClient' }.configureEach {
            doFirst {
                new File(probeDirectory, 'extended-crafting-supply-result.txt').delete()
                if (!clientWorld.isDirectory()) {
                    if (!sourceWorld.isDirectory()) throw new GradleException('Run the wireless supply GameTests first.')
                    project.copy { from sourceWorld; into clientWorld }
                }
            }
            doLast {
                def result = new File(probeDirectory, 'extended-crafting-supply-result.txt')
                if (!result.isFile() || !result.text.startsWith('PASS:'))
                    throw new GradleException('Extended Crafting supply probe failed: ' + (result.isFile() ? result.text : 'no result'))
            }
        }
    }
}
