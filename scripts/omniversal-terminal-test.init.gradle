allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/OmniversalTerminalGameTests.java'])
        minecraft.runs.gameTestServer {
            workingDirectory project.file('build/alpha-port-omniversal-gametest')
            property 'forge.enabledGameTestNamespaces', 'ae2lt_omniversal,ae2lt,minecraft'
            mods { ae2lt { source sourceSets.jdb } }
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def log = project.file('build/alpha-port-omniversal-gametest/logs/latest.log')
                if (!log.isFile() || !(log.text =~ /All \d+ required tests passed/).find()) {
                    throw new GradleException('Omniversal GameTests did not complete successfully')
                }
            }
        }
    }
}
