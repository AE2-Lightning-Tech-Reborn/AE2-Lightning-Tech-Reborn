// ./gradlew -I scripts/rainbow-pigmee-test.init.gradle runGameTestServer
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/RainbowPigmeeGameTests.java', '**/PigmeeBuildingGameTests.java',
                '**/RainbowPigmeeClientProbe.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group == null || dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics',
                    'de.mari_023', 'top.theillusivec4.curios', 'mezz.jei'] || dep.name == 'jei-238222')
        }
        neoForge.runs.gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2lt'
            gameDirectory = project.layout.buildDirectory.dir('rainbow-pigmee-gametest').get().asFile
        }
        if (project.hasProperty('rainbowClientProbe') || project.hasProperty('rainbowManualTest')) {
            neoForge.runs.client {
                systemProperty 'ae2lt.rainbowClientProbe', 'true'
                systemProperty 'ae2lt.rainbowManualTest', project.hasProperty('rainbowManualTest').toString()
                systemProperty 'ae2lt.rainbowFlowCapture', project.hasProperty('rainbowFlowCapture').toString()
                jvmArguments.set(jvmArguments.get().findAll { !it.startsWith('-agentlib:jdwp=') })
                gameDirectory = project.layout.buildDirectory.dir('rainbow-pigmee-client').get().asFile
                programArguments.addAll '--quickPlaySingleplayer', 'RainbowPigmeeTest'
            }
        }
    }
}
