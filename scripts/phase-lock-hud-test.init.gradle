// Native Forge phase-lock energy, creative slot recovery and swimming regressions.
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/PhaseLockCreativeRecoveryGameTests.java'])
        minecraft.runs.gameTestServer {
            workingDirectory project.file('.codex-tmp/phase-lock-hud-forge-gametest')
            property 'forge.enabledGameTestNamespaces', 'ae2lt_phase_lock,ae2lt'
            mods { ae2lt { source sourceSets.jdb } }
        }
    }
}
