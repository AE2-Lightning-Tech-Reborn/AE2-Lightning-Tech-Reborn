// JAVA_HOME=<Java 17> ./gradlew -I scripts/tianshu-workstation-test.init.gradle runGameTestServer
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes([
                '**/TianshuWorkCraftingGameTests.java', '**/TianshuCraftingGameTests.java',
                '**/TianshuWirelessGameTestChecks.java', '**/TianshuCellScrollFixture.java', '**/JeiWirelessSupplyGameTests.java'])
        minecraft.runs.gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'ae2lt_workstation,ae2lt_jei_supply'
            workingDirectory project.file('build/tianshu-workstation-forge')
            mods { ae2lt { source sourceSets.jdb } }
        }
    }
}
