// ./gradlew -I scripts/mining-factory-test.init.gradle runGameTestServer
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/MiningFactoryGameTests.java', '**/MiningFactoryClientProbe.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group == null || dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics',
                    'de.mari_023', 'top.theillusivec4.curios'])
        }
        // Optional integration suite: pass a directory containing Apotheosis,
        // Apothic Enchanting/Attributes/Spawners, Placebo, Blood Magic and Modopedia jars.
        if (project.hasProperty('miningCompatMods')) {
            dependencies.add('runtimeOnly', fileTree(project.property('miningCompatMods')) { include '*.jar' })
            sourceSets.jdb.java.srcDir 'src/miningCompatTest/java'
            sourceSets.jdb.java.include '**/MiningFactoryCompatGameTests.java'
            sourceSets.jdb.compileClasspath += configurations.runtimeClasspath
        }
        // Native Silent Gear tests, independent of the Apotheosis/Blood Magic suite.
        // Pass a directory with the Silent Gear and Silent Lib jars to test.
        if (project.hasProperty('miningSilentGearMods')) {
            dependencies.add('runtimeOnly', fileTree(project.property('miningSilentGearMods')) { include '*.jar' })
            sourceSets.jdb.java.srcDir 'src/miningSilentGearTest/java'
            sourceSets.jdb.java.include '**/MiningFactorySilentGearGameTests.java'
            sourceSets.jdb.compileClasspath += configurations.runtimeClasspath
        }
        neoForge.runs.gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2lt_mining'
            if (project.hasProperty('miningBenchmark')) systemProperty 'ae2lt.miningBenchmark', 'true'
            gameDirectory = project.layout.buildDirectory.dir(project.hasProperty('miningSilentGearMods')
                    ? 'mining-factory-silentgear-gametest' : project.hasProperty('miningCompatMods')
                    ? 'mining-factory-compat-gametest' : 'mining-factory-gametest').get().asFile
        }
        if (project.hasProperty('miningClientProbe')) {
            neoForge.runs.client {
                systemProperty 'ae2lt.miningClientProbe', 'true'
                gameDirectory = project.layout.buildDirectory.dir('mining-factory-client').get().asFile
                programArguments.addAll '--quickPlaySingleplayer', 'MiningFactoryTest'
            }
        }
    }
}
