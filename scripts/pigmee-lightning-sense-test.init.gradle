// ./gradlew -I scripts/pigmee-lightning-sense-test.init.gradle runGameTestServer
// Add -PpigmeeSenseWithCurios=false to also verify the optional-dependency boundary.
allprojects {
    afterEvaluate {
        def withCurios = providers.gradleProperty('pigmeeSenseWithCurios').getOrElse('true').toBoolean()
        sourceSets.jdb.java.setIncludes(['**/PigmeeLightningSenseGameTests.java', '**/LightningCollectorGameTests.java',
                '**/PigmeeLightningClientProbe.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics']
                    || (withCurios && dep.group == 'top.theillusivec4.curios'))
        }
        neoForge.runs.gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2lt_pigmee_lightning,ae2lt_collector'
            systemProperty 'ae2lt.pigmeeSenseWithCurios', withCurios.toString()
            gameDirectory = project.layout.buildDirectory.dir('pigmee-lightning-gametest-' + withCurios).get().asFile
        }
        neoForge.runs.client {
            gameDirectory = project.layout.buildDirectory.dir('pigmee-lightning-client-' + withCurios).get().asFile
            jvmArguments.set(jvmArguments.get().findAll { !it.startsWith('-agentlib:jdwp=') })
            systemProperty 'ae2lt.pigmeeLightningClientProbe', 'true'
            systemProperty 'ae2lt.pigmeeSenseWithCurios', withCurios.toString()
            programArguments.addAll '--quickPlaySingleplayer', 'PigmeeLightningReview'
        }
    }
}
