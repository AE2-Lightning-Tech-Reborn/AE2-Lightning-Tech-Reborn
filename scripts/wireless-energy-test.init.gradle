// ./gradlew -I scripts/wireless-energy-test.init.gradle runGameTestServer
allprojects {
    afterEvaluate {
        def restartPhase = project.findProperty('wirelessRestartPhase')
        sourceSets.jdb.java.setIncludes(restartPhase
                ? ['com/moakiee/ae2lt/logic/energy/WirelessEnergyRestartGameTests.java', 'com/moakiee/ae2lt/logic/energy/WirelessEnergyTestMachine.java']
                : ['com/moakiee/ae2lt/logic/energy/WirelessEnergyGameTests.java', 'com/moakiee/ae2lt/logic/energy/WirelessEnergyAdmissionGameTests.java', 'com/moakiee/ae2lt/logic/energy/WirelessEnergyTestMachine.java', 'com/moakiee/ae2lt/logic/energy/NetworkManagementGameTests.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            dep.group != null && !(dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics']
                    || dep.name in ['applied-flux-965012', 'glodium-957920'])
        }
        neoForge.runs.gameTestServer {
            gameDirectory = project.layout.buildDirectory.dir(providers.gradleProperty('wirelessEnergyGameTestDirectory').getOrElse('wireless-energy-gametest')).get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2lt'
            if (restartPhase) systemProperty 'ae2lt.energy.restartPhase', restartPhase
        }
    }
}
