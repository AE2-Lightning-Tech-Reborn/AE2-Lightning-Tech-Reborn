// Real Forge API fault injection; no fixture is a release dependency.
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/EnergyApiStressGameTests.java'])
        minecraft.runs.gameTestServer {
            workingDirectory project.file("build/energy-api-stress-${project.findProperty('energyStressProfile') ?: 'default'}")
            property 'forge.enabledGameTestNamespaces', 'ae2lt_stress,minecraft'
            property 'forge.logging.console.level', 'info'
            mods { ae2lt { source sourceSets.jdb } }
        }
    }
}
