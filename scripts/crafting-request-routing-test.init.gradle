allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/CraftingRequestRoutingGameTests.java', '**/BigServiceTestFixture.java'])
        minecraft.runs.gameTestServer {
            workingDirectory project.file('build/alpha-port-crafting-request-gametest')
            property 'forge.enabledGameTestNamespaces', 'ae2lt_request_routing,ae2lt_io,minecraft'
            mods { ae2lt { source sourceSets.jdb } }
        }
    }
}
