// Pass a Mojang-mapped NeoECO development jar without an embedded SRG Registrate.
// neoEcoBatchTestRegistrate optionally supplies an already-mapped Registrate jar for offline runs.
allprojects {
    afterEvaluate {
        def neoEcoJar = project.findProperty('neoEcoBatchTestJar')
        if (!neoEcoJar || !project.file(neoEcoJar).isFile())
            throw new GradleException('Set -PneoEcoBatchTestJar to a mapped NeoECO development jar.')
        sourceSets.jdb.java.setIncludes(['**/GlobalBatchAdaptersGameTests.java', '**/BigMixedProviderGameTests.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group in ['com.moakiee.thunderbolt', 'appeng', 'org.appliedenergistics'])
        }
        dependencies.add('runtimeOnly', files(neoEcoJar))
        def mappedRegistrate = project.findProperty('neoEcoBatchTestRegistrate')
        if (mappedRegistrate) {
            dependencies.add('runtimeOnly', files(mappedRegistrate))
        } else {
            repositories.maven {
                url = 'https://maven.createmod.net'
                content { includeGroup 'com.tterrag.registrate' }
            }
            dependencies.add('runtimeOnly', fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3'))
        }
        dependencies.add('runtimeOnly', fg.deobf('maven.modrinth:ldlib:mc1.20.1-1.0.33.b-forge'))
        minecraft.runs.gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'ae2lt_global_batch,ae2lt_bigint,ae2lt_migration'
            property 'ae2lt.neoecoBatchTestRequired', 'true'
            workingDirectory project.file('build/neoeco-batch-forge')
            mods { ae2lt { source sourceSets.jdb } }
        }
        tasks.matching { it.name == 'downloadAssets' }.configureEach { enabled = false }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def log = project.file('build/neoeco-batch-forge/logs/latest.log').text
                def passed = log =~ /All (\d+) required tests passed/
                if (!passed.find() || passed.group(1).toInteger() < 13)
                    throw new GradleException('Expected all 13 batch provider GameTests to execute.')
                if (!log.contains('neoecoae'))
                    throw new GradleException('NeoECO was not present in the test runtime.')
            }
        }
    }
}
