// ./gradlew -I scripts/interface-export-fairness-test.init.gradle runGameTestServer
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/OverloadedInterfaceExportFairnessGameTests.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group == 'com.moakiee.thunderbolt' || dep.group == 'org.appliedenergistics')
        }
        neoForge.runs.gameTestServer {
            gameDirectory = project.file(providers.gradleProperty('ae2ltFairnessRunDirectory')
                    .getOrElse('build/interface-export-fairness-gametest'))
            jvmArguments.addAll('-Xms512m', '-Xmx2g')
            if (project.hasProperty('ae2ltFairnessBenchmark')) {
                systemProperty 'ae2lt.exportFairnessBenchmark', 'true'
                systemProperty 'ae2lt.wirelessIoBenchmark', 'true'
                systemProperty 'ae2lt.wirelessIoBenchmark.includeEligibility', 'true'
                systemProperty 'ae2lt.wirelessIoBenchmark.worktreeDirty', 'true'
                systemProperty 'ae2lt.wirelessIoBenchmark.scenario', providers.gradleProperty('ae2ltBenchmarkScenario').get()
                systemProperty 'ae2lt.wirelessIoBenchmark.gitHead', providers.gradleProperty('ae2ltBenchmarkGitHead').getOrElse('unknown')
                systemProperty 'ae2lt.wirelessIoBenchmark.warmupTicks', '200'
                systemProperty 'ae2lt.wirelessIoBenchmark.sampleTicks', '1200'
                systemProperty 'ae2lt.exportFairnessBenchmark.keys', providers.gradleProperty('ae2ltFairnessKeys').getOrElse('27')
            }
        }
        if (project.hasProperty('ae2ltFairnessBaselineSource')) {
            def original = project.file('src/main/java/com/moakiee/ae2lt/blockentity/OverloadedInterfaceBlockEntity.java')
            def baseline = project.file(project.property('ae2ltFairnessBaselineSource'))
            tasks.named('compileJava') {
                setSource(source.filter { it != original } + project.files(baseline))
            }
        }
    }
}
