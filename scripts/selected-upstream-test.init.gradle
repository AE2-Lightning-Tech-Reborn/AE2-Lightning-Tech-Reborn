// Forge 1.20.1 regressions for the four selected upstream ports; fixtures stay local to dev runs.
allprojects {
    plugins.withId('net.minecraftforge.gradle') {
        if (project.hasProperty('upstreamFixMods')) {
            repositories.flatDir { dirs project.property('upstreamFixMods') }
            dependencies.add('runtimeOnly', fg.deobf('local.silentgear:silent-gear-1.20.1:3.6.7'))
            dependencies.add('runtimeOnly', fg.deobf('local.silentgear:silent-lib-1.20.1:8.0.0'))
        }
    }
    afterEvaluate {
        sourceSets.jdb.java.setIncludes([
                '**/MiningFactoryGameTests.java', '**/MiningFactoryClientProbe.java',
                '**/OverloadedIOPortGameTests.java', '**/OverloadedIOPortClientProbe.java',
                '**/PhaseLockCreativeRecoveryGameTests.java',
                '**/PhaseFlightGroundCrouchGameTests.java', '**/ProviderReturnFilterGameTests.java',
                '**/ManualInputTransferGameTests.java', '**/EnergyApiStressGameTests.java'])
        if (project.hasProperty('upstreamFixMods')) {
            sourceSets.jdb.java.include '**/UpstreamFixGameTests.java', '**/MiningFactoryStressGameTests.java'
        }
        sourceSets.jdb.java.include '**/CoverageClientSequence.java'
        minecraft.runs.gameTestServer {
            workingDirectory project.file("build/selected-upstream-forge-${project.findProperty('selectedPortProfile') ?: 'default'}")
            property 'forge.enabledGameTestNamespaces', 'ae2lt,ae2lt_io,ae2lt_mining,ae2lt_phase,ae2lt_phase_lock,ae2lt_fixes,ae2lt_stress,minecraft'
            property 'forge.logging.console.level', 'info'
            mods { ae2lt { source sourceSets.jdb } }
        }
    }
}
