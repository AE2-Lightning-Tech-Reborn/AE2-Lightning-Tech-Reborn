// Apply after wireless-energy-test.init.gradle for isolated FE-to-AE integration tests.
allprojects {
    afterEvaluate {
        def phase = project.findProperty('wirelessAeRestartPhase')
        sourceSets.jdb.java.setIncludes(phase
                ? ['com/moakiee/ae2lt/logic/energy/WirelessAeFallbackRestartGameTests.java']
                : ['com/moakiee/ae2lt/logic/energy/WirelessAeFallbackGameTests.java'])
        neoForge.runs.gameTestServer {
            gameDirectory = project.layout.buildDirectory.dir(phase ? 'wireless-ae-restart-gametest' : 'wireless-ae-fallback-gametest').get().asFile
            if (phase) systemProperty 'ae2lt.energy.aeRestartPhase', phase
        }
    }
}
