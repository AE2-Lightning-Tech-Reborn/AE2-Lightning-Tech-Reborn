// Java 17 / Forge 1.20.1: real Mekanism tanks and Applied Mekanistics 1.4.3.
// ./gradlew -I scripts/interface-fluid-chemical-test.init.gradle runGameTestServer
// The optional bridge is confined to this validation profile, outside the product jar.
allprojects {
    afterEvaluate {
        dependencies.add('jdbImplementation', fg.deobf('maven.modrinth:applied-mekanistics:1.4.3'))
        dependencies.add('runtimeOnly', fg.deobf('maven.modrinth:applied-mekanistics:1.4.3'))
        sourceSets.jdb.java.setIncludes(['**/OverloadedInterfaceMekanismProbe.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics', 'mekanism']
                    || (dep.group == 'maven.modrinth' && dep.name == 'applied-mekanistics'))
        }
        minecraft.runs.gameTestServer {
            workingDirectory project.file(providers.gradleProperty('ae2ltChemicalRunDirectory')
                    .getOrElse('build/interface-fluid-chemical-gametest'))
            property 'forge.enabledGameTestNamespaces', 'ae2lt_interface_input'
            property 'forge.logging.console.level', 'info'
            mods { ae2lt { source sourceSets.jdb } }
            jvmArgs '-Xms256m', '-Xmx2g'
        }
    }
}
