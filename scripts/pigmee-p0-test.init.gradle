// Opt-in P0 runtime checks. Does not change release dependencies or the ordinary run directory.
allprojects {
    afterEvaluate {
        def localRepo = providers.gradleProperty('pigmeeLocalMaven').orNull
        if (localRepo) repositories.maven { url = uri(localRepo) }
        sourceSets.jdb.java.setIncludes(['com/moakiee/ae2lt/workstation/*Tests.java',
                                        'com/moakiee/ae2lt/workstation/PigmeeRestartProbe.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics'])
        }
        neoForge.runs.gameTestServer {
            gameDirectory = project.layout.buildDirectory.dir(providers.gradleProperty('pigmeeGameTestDirectory').getOrElse('pigmee-p0-gametest')).get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2lt_pigmee_p0'
            systemProperty 'ae2lt.pigmeeP0', 'true'
            jvmArguments.add '-Xmx1536m'
        }
        neoForge.runs.server {
            gameDirectory = project.layout.buildDirectory.dir('pigmee-p0-restart').get().asFile
            systemProperty 'ae2lt.pigmeeP0', 'true'
            systemProperty 'ae2lt.pigmeeRestartPhase', providers.gradleProperty('pigmeeRestartPhase').getOrElse('')
            jvmArguments.add '-Xmx1536m'
        }
    }
}
