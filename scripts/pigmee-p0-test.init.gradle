// Opt-in P0 runtime checks. Does not change release dependencies or the ordinary run directory.
allprojects {
    afterEvaluate {
        def localRepo = providers.gradleProperty('pigmeeLocalMaven').orNull
        if (localRepo) repositories.maven { url = uri(localRepo) }
        sourceSets.jdb.java.setIncludes(['com/moakiee/ae2lt/workstation/*Tests.java',
                                        'com/moakiee/ae2lt/workstation/PigmeeRestartProbe.java', 'com/moakiee/ae2lt/workstation/PigmeeClientProbe.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics'])
        }
        neoForge.runs.gameTestServer {
            gameDirectory = project.layout.buildDirectory.dir(providers.gradleProperty('pigmeeGameTestDirectory').getOrElse('pigmee-p0-gametest')).get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('pigmeeTestNamespace').getOrElse('ae2lt_pigmee_p0')
            systemProperty 'ae2lt.pigmeeP0', 'true'
            jvmArguments.add '-Xmx1536m'
        }
        neoForge.runs.create('pigmeeClient') {
            client()
            gameDirectory = project.layout.buildDirectory.dir(providers.gradleProperty('pigmeeClientDirectory').getOrElse('pigmee-p1-client')).get().asFile
            programArguments.addAll '--username', 'PigmeeQA', '--quickPlaySingleplayer', 'PigmeeQA'
            systemProperty 'ae2lt.pigmeeP0', 'true'
            systemProperty 'ae2lt.pigmeeClientProbe', 'true'
            systemProperty 'ae2lt.pigmeeRemoteView', providers.gradleProperty('pigmeeRemoteView').getOrElse('false')
            systemProperty 'ae2lt.pigmeeRemoteRestoreProbe', providers.gradleProperty('pigmeeRemoteRestoreProbe').getOrElse('false')
            systemProperty 'ae2lt.pigmeeNativeStopControl', providers.gradleProperty('pigmeeNativeStopControl').getOrElse('false')
            systemProperty 'ae2lt.pigmeeRemoteFreshActivation', providers.gradleProperty('pigmeeRemoteFreshActivation').getOrElse('false')
            systemProperty 'ae2lt.pigmeeRemoteRealPlayerControl', providers.gradleProperty('pigmeeRemoteRealPlayerControl').getOrElse('false')
            systemProperty 'ae2lt.pigmeeRemoteTerrainOnly', providers.gradleProperty('pigmeeRemoteTerrainOnly').getOrElse('false')
            systemProperty 'ae2lt.pigmeeRemoteShutdownControl', providers.gradleProperty('pigmeeRemoteShutdownControl').getOrElse('false')
            systemProperty 'ae2lt.pigmeeRemoteShutdownProbe', providers.gradleProperty('pigmeeRemoteShutdownProbe').getOrElse('false')
            systemProperty 'ae2lt.pigmeeRemoteClientProbe', providers.gradleProperty('pigmeeRemoteClientProbe').getOrElse('false')
            systemProperty 'ae2lt.pigmeeClientDeathPhase', providers.gradleProperty('pigmeeClientDeathPhase').getOrElse('')
            systemProperty 'ae2lt.pigmeeClientRestoreProbe', providers.gradleProperty('pigmeeClientRestore').getOrElse('false')
            jvmArguments.add '-Xmx1536m'
        }
        neoForge.runs.server {
            gameDirectory = project.layout.buildDirectory.dir(providers.gradleProperty('pigmeeRestartDirectory').getOrElse('pigmee-p0-restart')).get().asFile
            systemProperty 'ae2lt.pigmeeP0', 'true'
            systemProperty 'ae2lt.pigmeeRestartPhase', providers.gradleProperty('pigmeeRestartPhase').getOrElse('')
            jvmArguments.add '-Xmx1536m'
        }
    }
}
