// Isolated Forge runtime regressions; optional jars are test-only and never bundled.
allprojects {
    plugins.withId('net.minecraftforge.gradle') {
        if (project.hasProperty('upstreamFixMods')) {
            repositories.flatDir { dirs project.property('upstreamFixMods') }
            dependencies.add('runtimeOnly', fg.deobf('local.silentgear:silent-gear-1.20.1:3.6.7'))
            dependencies.add('runtimeOnly', fg.deobf('local.silentgear:silent-lib-1.20.1:8.0.0'))
        }
    }
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/UpstreamFixGameTests.java'])
        if (project.hasProperty('upstreamFixStress')) {
            sourceSets.jdb.java.include '**/MiningFactoryStressGameTests.java'
        }
        minecraft.runs.gameTestServer {
            workingDirectory project.layout.buildDirectory.dir('upstream-fixes-gametest').get().asFile
            property 'forge.enabledGameTestNamespaces', 'ae2lt_fixes,minecraft'
            property 'forge.logging.console.level', 'info'
            mods { "${project.mod_id}" { source sourceSets.jdb } }
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doFirst {
                systemProperty 'forge.enabledGameTestNamespaces', 'ae2lt_fixes,minecraft'
            }
        }
    }
}
