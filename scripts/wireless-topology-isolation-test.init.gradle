// ./gradlew -I scripts/wireless-topology-isolation-test.init.gradle runGameTestServer
allprojects {
    afterEvaluate {
        sourceSets.jdb.java.setIncludes(['**/WirelessTopologyIsolationGameTests.java'])
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            !(dep.group in ['com.moakiee.thunderbolt', 'org.appliedenergistics'])
        }
        neoForge.runs.gameTestServer {
            gameDirectory = project.layout.buildDirectory.dir('wireless-topology-isolation-gametest').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2lt,ae2lt_topology_isolation'
        }
    }
}
