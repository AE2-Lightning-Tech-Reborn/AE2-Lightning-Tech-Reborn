    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += output + compileClasspath
    java {
        srcDir 'src/jdb/java'
        include 'qa/**'
        include '**/FrequencyPermissionsGameTests.java'
        include '**/BigMixedProviderGameTests.java'
        include '**/CoreAlgorithmAcceptanceGameTests.java'
        include '**/NeoEcoGtoGameTests.java'
        include '**/BigCandidateIndexGameTests.java'
        include '**/BigZeroTickGameTests.java'
        include '**/UselessBigIntegerGameTests.java'
        include '**/BigServiceTestFixture.java'
        include '**/ProviderMachineAdaptationGameTests.java'
        include '**/ProviderMekanismReturnGameTests.java'
        include '**/BigCraftingReportGameTests.java'
        include '**/TianshuDeferredReturnsGameTests.java'
        include '**/PhaseFreecamClientProbe.java'
        include '**/BigIntegerPipelineGameTests.java'
        include '**/GlobalBatchAdaptersGameTests.java'
        include '**/OverloadedInterfaceExportFairnessGameTests.java'
        include '**/OverloadedIOPortGameTests.java'
        include '**/InfiniteCellRegressionGameTests.java'
        include '**/BigTerminalClientProbe.java'
        include '**/JeiMultiblockLayoutClientProbe.java'
        include '**/JeiTransferCompatibilityClientProbe.java'
        include '**/EmiMultiblockClientProbe.java'
        // Upstream 2.1.3 regressions are opt-in fixtures, never production classes.
        include '**/AdjacentFluidExportReceiptGameTests.java'
        include '**/CrystalHarvestReloadGameTests.java'
        include '**/PigmeeCrystalCatalyzerGameTests.java'
        include '**/MiningFactoryStressGameTests.java'
        include '**/UpstreamFixGameTests.java'
        include '**/WirelessInterfaceGameTests.java'
        include '**/ActualCompatibilityGameTests.java'
        include '**/AppGenProcessorGameTests.java'
        include '**/InterfaceEnergyRoutingGameTests.java'
        include '**/ManualInputTransferGameTests.java'
        include '**/MguConveyorPhaseLockGameTests.java'
        include '**/NeoEcoCatalyzerGameTests.java'
        include '**/NightVisionArmorGameTests.java'
        include '**/OmniversalTerminalGameTests.java'
        include '**/PatternMigrationGameTests.java'
        include '**/PatternMigrationPerformanceGameTests.java'
        include '**/PigmeeAdjacentStorageGameTests.java'
        include '**/PigmeeBuildingGameTests.java'
